name: Bug Report
description: Report a reproducible problem or defect in Cubyntra
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and fix it.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser & Operating System
      placeholder: e.g. Chrome 124 on macOS Sonoma / Safari on iOS 17.4
    validations:
      required: true
  - type: input
    id: camera
    attributes:
      label: Camera Device
      placeholder: e.g. Integrated MacBook Pro FaceTime HD / Logitech C920 / iPhone rear camera
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the issue.
      placeholder: |
        1. Open scanner view
        2. Scan white face
        3. Turn to green face
        4. See error message ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior / Console Output
      description: What actually happened, including any browser console errors.
    validations:
      required: true
