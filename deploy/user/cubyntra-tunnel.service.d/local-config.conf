# Drop-in for a *locally managed* tunnel (how necore runs it): `cloudflared tunnel login`,
# `cloudflared tunnel create cubyntra`, `cloudflared tunnel route dns cubyntra cubyntra.necookie.dev`,
# and ~/.cloudflared/cubyntra.yml (copy cloudflared-config.example.yml, with the tunnel id and
# credentials-file under ~/.cloudflared). It replaces the token-file ExecStart of the main unit.
# Install: mkdir -p ~/.config/systemd/user/cubyntra-tunnel.service.d && cp this file there.

[Unit]
ConditionPathExists=
ConditionPathExists=%h/.cloudflared/cubyntra.yml

[Service]
ExecStart=
ExecStart=%h/.local/bin/cloudflared tunnel --no-autoupdate --config %h/.cloudflared/cubyntra.yml run cubyntra
